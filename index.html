<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贝迪克凌云工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f0f4f8;display:flex;min-height:100vh}
/* 侧边栏 */
.sidebar{width:230px;background:linear-gradient(180deg,#0d2137 0%,#143a5c 100%);color:#fff;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:100}
.logo{padding:22px 18px;border-bottom:1px solid rgba(255,255,255,.12)}
.logo h1{font-size:19px;letter-spacing:1px}
.logo p{font-size:11px;color:#8fb3d1;margin-top:4px}
.nav{flex:1;padding:14px 0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:13px 18px;cursor:pointer;color:#c9dcf0;font-size:14.5px;border-left:3px solid transparent;transition:.15s}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:rgba(41,128,185,.28);border-left-color:#3498db;color:#fff;font-weight:600}
.nav-item .ico{font-size:17px;width:22px;text-align:center}
.side-foot{padding:14px 18px;font-size:11px;color:#6d90ad;border-top:1px solid rgba(255,255,255,.1)}
/* 主区域 */
.main{margin-left:230px;flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{background:#fff;padding:14px 26px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);position:sticky;top:0;z-index:50}
.topbar h2{font-size:18px;color:#0d2137;flex:1}
.updated{font-size:12px;color:#8a97a5}
.countdown{font-size:12px;color:#3498db;min-width:88px;text-align:right}
.btn{background:#2980b9;color:#fff;border:none;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:13.5px;display:flex;align-items:center;gap:6px;transition:.15s}
.btn:hover{background:#3498db}
.btn:disabled{background:#95a5a6;cursor:wait}
.btn.spin .r{display:inline-block;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.content{padding:24px 26px;flex:1}
.section{display:none}
.section.active{display:block}
/* 卡片 */
.card{background:#fff;border-radius:10px;padding:20px 22px;margin-bottom:18px;box-shadow:0 1px 3px rgba(13,33,55,.08)}
.card h3{font-size:15.5px;color:#0d2137;margin-bottom:14px;padding-left:10px;border-left:4px solid #2980b9}
/* 日报 */
.stat-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.stat{flex:1;min-width:150px;background:#fff;border-radius:10px;padding:18px 20px;box-shadow:0 1px 3px rgba(13,33,55,.08)}
.stat .label{font-size:12.5px;color:#8a97a5}
.stat .num{font-size:26px;white-space:nowrap;font-weight:700;color:#0d2137;margin-top:6px}
.stat .num.blue{color:#2980b9}.stat .num.orange{color:#e67e22}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.cat-item{background:#f7fafc;border:1px solid #e3eaf1;border-radius:8px;padding:12px 14px}
.cat-item .t{font-size:12.5px;color:#5d7a93;margin-bottom:6px}
.cat-item .v{font-size:13.5px;color:#22313f;white-space:pre-line;line-height:1.55}
.minutes{list-style:none;padding-left:0}.minutes li{margin:8px 0;line-height:1.7;color:#22313f;font-size:14px}
.io-table{width:100%;border-collapse:collapse;font-size:13.5px}
.io-table th,.io-table td{border:1px solid #e3eaf1;padding:10px 12px;text-align:left}
.io-table th{background:#f0f6fb;color:#0d2137}
.sign-row{display:flex;gap:30px;color:#5d7a93;font-size:13px;margin-top:6px}
/* 新闻列表 */
.news-item{display:block;padding:15px 4px;border-bottom:1px solid #edf2f7;text-decoration:none;color:inherit;transition:.12s}
.news-item:last-child{border-bottom:none}
.news-item:hover{background:#f7fafc}
.news-item .ttl{font-size:14.5px;color:#1a3a54;font-weight:600;line-height:1.5}
.news-item .ttl:hover{color:#2980b9}
.news-item .meta{font-size:12px;color:#93a5b5;margin:6px 0}
.news-item .meta .src{background:#eaf2f9;color:#2980b9;padding:2px 8px;border-radius:10px;margin-right:8px}
.news-item .sum{font-size:13px;color:#5a6b7c;line-height:1.65}
.news-item .url{font-size:11.5px;color:#3498db;margin-top:5px;word-break:break-all}
.key-box{background:#eef7ff;border-left:3px solid #3498db;padding:8px 12px;margin-top:8px;font-size:13px;color:#1a5276;line-height:1.6;border-radius:0 6px 6px 0}
.key-box b{color:#0d2137}
/* 日报日期选择 */
.date-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.date-chip{background:#fff;border:1.5px solid #d5e2ee;color:#3a5a76;border-radius:18px;padding:6px 14px;font-size:13px;cursor:pointer;transition:.12s}
.date-chip:hover{border-color:#2980b9;color:#2980b9}
.date-chip.active{background:#2980b9;border-color:#2980b9;color:#fff;font-weight:600}
/* 英语 */
.checkin-bar{display:flex;align-items:center;gap:16px;background:linear-gradient(90deg,#1a5276,#2980b9);color:#fff;border-radius:10px;padding:18px 22px;margin-bottom:18px;flex-wrap:wrap}
.checkin-bar .info{flex:1;min-width:180px}
.checkin-bar .streak{font-size:24px;font-weight:700}
.checkin-btn{background:#f39c12;color:#fff;border:none;padding:11px 26px;border-radius:24px;font-size:15px;font-weight:600;cursor:pointer;transition:.15s}
.checkin-btn:hover{background:#e67e22;transform:scale(1.03)}
.checkin-btn.done{background:#27ae60;cursor:default}
.word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.word-item{background:#f7fafc;border:1px solid #e3eaf1;border-radius:8px;padding:14px 16px}
.word-item .en{font-size:17px;font-weight:700;color:#1a5276}
.word-item .cn{font-size:13.5px;color:#e67e22;margin:4px 0 8px}
.word-item .eg{font-size:12.5px;color:#5a6b7c;font-style:italic;line-height:1.55}
.phrase li{margin:10px 0;line-height:1.6;font-size:14px;color:#22313f}
.phrase li .pc{display:block;font-size:13px;color:#7d8fa1}
.tip{background:#fef9e7;border:1px solid #f7dc6f;border-radius:8px;padding:12px 16px;font-size:13.5px;color:#7d6608;margin-top:14px}
.loading{color:#8a97a5;text-align:center;padding:60px 0;font-size:14px}
/* 天气 */
.weather-main{display:flex;gap:30px;flex-wrap:wrap;align-items:center}
.w-left{flex:1;min-width:200px}
.w-temp{font-size:64px;font-weight:800;color:#1a5276;line-height:1}
.w-temp span{font-size:22px;color:#7d8fa1;font-weight:600}
.w-desc{font-size:22px;color:#2980b9;margin:6px 0 4px}
.w-area{font-size:13px;color:#8a97a5}
.w-right{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;flex:1.2;min-width:260px}
.w-item{background:#f7fafc;border:1px solid #e3eaf1;border-radius:8px;padding:12px 14px;font-size:13px;color:#5a6b7c}
.w-item b{display:block;font-size:17px;color:#22313f;margin-top:3px}
.fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.fc-item{background:#f7fafc;border:1px solid #e3eaf1;border-radius:8px;padding:14px;text-align:center}
.fc-date{font-size:13px;color:#5a6b7c}
.fc-desc{font-size:16px;font-weight:700;color:#1a5276;margin:8px 0}
.fc-temp{font-size:13px;color:#7d8fa1}
.fc-temp .max{color:#e67e22;font-weight:600}
.fc-temp .min{color:#3498db;font-weight:600}
@media(max-width:820px){.sidebar{width:64px}.logo h1,.logo p,.nav-item span.txt,.side-foot{display:none}.main{margin-left:64px}.nav-item{justify-content:center;padding:14px 0}}
</style>
</head>
<body>
<nav class="sidebar">
  <div class="logo"><h1>✈️ 贝迪克凌云</h1><p>生产信息工作台</p></div>
  <div class="nav" id="nav">
    <div class="nav-item active" data-sec="ribao"><span class="ico">📋</span><span class="txt">生产日报</span></div>
    <div class="nav-item" data-sec="accidents"><span class="ico">⚠️</span><span class="txt">民航维修事故</span></div>
    <div class="nav-item" data-sec="tech"><span class="ico">🔧</span><span class="txt">民航维修技术</span></div>
    <div class="nav-item" data-sec="english"><span class="ico">📖</span><span class="txt">民航英语学习</span></div>
    <div class="nav-item" data-sec="ai"><span class="ico">🤖</span><span class="txt">AI资讯</span></div>
    <div class="nav-item" data-sec="weather"><span class="ico">🌤️</span><span class="txt">天气</span></div>
  </div>
  <div class="side-foot">数据源：IMA知识库<br>贝迪克凌云（宜昌）</div>
</nav>
<div class="main">
  <div class="topbar">
    <h2 id="secTitle">📋 生产日报</h2>
    <span class="updated" id="updatedAt">--</span>
  </div>
  <div class="content" id="content"><div class="loading">数据加载中…</div></div>
</div>
<script>
const TITLES={ribao:"📋 生产日报",accidents:"⚠️ 民航维修事故",tech:"🔧 民航维修技术",english:"📖 民航英语学习",ai:"🤖 AI资讯",weather:"🌤️ 天气"};
const AUTO_SEC=600;
let cur=(location.hash||"").replace("#","")||"ribao",DATA=null,cdLeft=AUTO_SEC,curDate=null;
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nl=s=>esc(s).replace(/\n/g,"<br>");

async function loadData(){
  try{
    const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});
    DATA=await r.json();
    document.getElementById("updatedAt").textContent="数据更新于 "+(DATA.updated||"未知");
    render();
    cdLeft=AUTO_SEC;
  }catch(e){
    if(!DATA)document.getElementById("content").innerHTML='<div class="loading">⚠️ 数据加载失败：'+esc(e.message)+"</div>";
  }
}

function render(){
  const c=document.getElementById("content");
  if(cur==="ribao"){
    const reps=DATA.daily_reports&&DATA.daily_reports.length?DATA.daily_reports:[DATA.ribao];
    if(!curDate)curDate=reps[0].date;
    c.innerHTML=renderDateBar(reps)+renderRibao(reps.find(r=>r.date===curDate)||reps[0]);
  }
  else if(cur==="accidents")c.innerHTML=renderNews(DATA.accidents,false);
  else if(cur==="tech")c.innerHTML=renderNews(DATA.tech,false);
  else if(cur==="ai")c.innerHTML=renderNews(DATA.ai,true);
  else if(cur==="english")c.innerHTML=renderEnglish(DATA.english);
  else if(cur==="weather")c.innerHTML=renderWeather(DATA.weather);
}

function renderDateBar(reps){
  return '<div class="date-bar">'+reps.map(r=>
    '<span class="date-chip '+(r.date===curDate?"active":"")+'" data-date="'+esc(r.date)+'">'+esc(r.date.slice(5).replace("-","."))+' '+esc(r.weekday||"")+'</span>'
  ).join("")+'</div>';
}

function renderRibao(d){
  if(!d)return '<div class="loading">暂无日报数据</div>';
  const catHtml=(d.categories||[]).map(x=>`<div class="cat-item"><div class="t">${esc(x.name)}</div><div class="v">${nl(x.value||"N/A")}</div></div>`).join("");
  const minHtml=(d.minutes||[]).map(m=>`<li>${nl(m)}</li>`).join("");
  const io=d.io||{};
  return `
  <div class="stat-row">
    <div class="stat" style="min-width:230px"><div class="label">📅 日报日期</div><div class="num blue" style="font-size:21px">${esc(d.date)} ${esc(d.weekday||"")}</div></div>
    <div class="stat"><div class="label">🛠️ ${esc(d.zaixiu||"在修飞机").replace(/\s+/g," ")}</div><div class="num blue">${(esc(d.zaixiu).match(/(\d+)/)||["","-"])[1]} 架</div></div>
    <div class="stat"><div class="label">📦 封存飞机</div><div class="num orange">${(esc(d.fengcun).match(/(\d+)/)||["","-"])[1]} 架</div></div>
    <div class="stat"><div class="label">🗂️ 累计日报</div><div class="num">${d.total_sheets||"-"} 天</div></div>
  </div>
  <div class="card"><h3>生产情况</h3><div class="cat-grid">${catHtml}</div></div>
  <div class="card"><h3>每日生产纪要</h3><ol class="minutes">${minHtml||"<li>N/A</li>"}</ol></div>
  <div class="card"><h3>飞机进出场信息</h3>
    <table class="io-table"><tr><th>${esc(io.yesterday_label||"昨日")}</th><th>${esc(io.today_label||"今日")}</th><th>${esc(io.tomorrow_label||"明日")}</th><th>备注</th></tr>
    <tr><td>${nl(io.yesterday||"-")}</td><td>${nl(io.today||"-")}</td><td>${nl(io.tomorrow||"-")}</td><td>${nl(io.note||"-")}</td></tr></table>
    <div class="sign-row"><span>✍️ ${esc(d.preparer||"")}</span><span>✅ ${esc(d.reviewer||"")}</span></div>
  </div>`;
}

function renderWeather(w){
  if(!w||!w.tempC)return '<div class="loading">暂无天气数据</div>';
  const fc=(w.forecast||[]).map(f=>
    '<div class="fc-item"><div class="fc-date">'+esc(f.date.slice(5).replace("-","."))+'</div><div class="fc-desc">'+esc(f.desc)+'</div><div class="fc-temp"><span class="max">'+esc(f.maxtempC)+'°</span> / <span class="min">'+esc(f.mintempC)+'°</span></div></div>'
  ).join("");
  const wd=esc((w.windDir||"")+" "+(w.windKmph||"-")+"km/h");
  return `
  <div class="card weather-main">
    <div class="w-left">
      <div class="w-temp">${esc(w.tempC)}<span>°C</span></div>
      <div class="w-desc">${esc(w.desc)}</div>
      <div class="w-area">📍 ${esc(w.city||"")}${w.area?(" · "+esc(w.area)):""}</div>
    </div>
    <div class="w-right">
      <div class="w-item">🌡️ 体感<b>${esc(w.feelsC||"-")}°C</b></div>
      <div class="w-item">💧 湿度<b>${esc(w.humidity||"-")}%</b></div>
      <div class="w-item">💨 风力<b>${wd}</b></div>
      <div class="w-item">🕐 更新<b>${esc(w.updated||"-")}</b></div>
    </div>
  </div>
  <div class="card"><h3>📅 未来预报</h3><div class="fc-grid">${fc||'<div class="loading">暂无预报</div>'}</div></div>`;
}

function renderNews(list,isAI){
  if(!list||!list.length)return '<div class="loading">暂无资讯</div>';
  const items=list.map(n=>`
    <a class="news-item" href="${esc(n.url)}" target="_blank" rel="noopener">
      <div class="ttl">${esc(n.title)}</div>
      <div class="meta"><span class="src">${esc(n.source||"")}</span>${esc(n.date||"")}</div>
      ${n.summary?`<div class="sum">${esc(n.summary)}</div>`:""}
      ${n.key?`<div class="key-box"><b>🔑 关键信息：</b>${esc(n.key)}</div>`:""}
      <div class="url">🔗 ${esc(n.url)}</div>
    </a>`).join("");
  return `<div class="card">${items}</div>`;
}

const CI_KEY="ly_eng_checkin";
function getCI(){try{return JSON.parse(localStorage.getItem(CI_KEY)||"{}")}catch(e){return{}}}
function renderEnglish(d){
  if(!d)return '<div class="loading">暂无英语学习内容</div>';
  const ci=getCI(),today=new Date().toISOString().slice(0,10);
  const done=ci.last===today,streak=ci.streak||0;
  const words=(d.words||[]).map(w=>`<div class="word-item"><div class="en">${esc(w.en)}</div><div class="cn">${esc(w.cn)}</div><div class="eg">${esc(w.eg||"")}</div></div>`).join("");
  const phrases=(d.phrases||[]).map(p=>`<li>${esc(p.en)}<span class="pc">${esc(p.cn)}</span></li>`).join("");
  return `
  <div class="checkin-bar">
    <div class="info"><div style="font-size:13px;opacity:.85">${esc(d.theme||"民航英语每日学习")} · ${esc(d.date||"")}</div>
    <div class="streak">🔥 已连续打卡 ${streak} 天</div></div>
    <button class="checkin-btn ${done?"done":""}" id="ciBtn" ${done?"disabled":""}>${done?"✅ 今日已打卡":"📌 立即打卡"}</button>
  </div>
  <div class="card"><h3>📚 今日词汇</h3><div class="word-grid">${words}</div></div>
  <div class="card"><h3>💬 实用句型</h3><ul class="phrase">${phrases}</ul>
  ${d.tip?`<div class="tip">💡 ${esc(d.tip)}</div>`:""}</div>`;
}

document.addEventListener("click",e=>{
  if(e.target&&e.target.id==="ciBtn"){
    const ci=getCI(),today=new Date().toISOString().slice(0,10);
    const yest=new Date(Date.now()-864e5).toISOString().slice(0,10);
    ci.streak=(ci.last===yest)?(ci.streak||0)+1:1;
    ci.last=today;localStorage.setItem(CI_KEY,JSON.stringify(ci));
    render();
  }
  const chip=e.target.closest?e.target.closest(".date-chip"):null;
  if(chip){curDate=chip.dataset.date;render();return;}
  const ni=e.target.closest?e.target.closest(".nav-item"):null;
  if(ni){
    document.querySelectorAll(".nav-item").forEach(x=>x.classList.remove("active"));
    ni.classList.add("active");cur=ni.dataset.sec;
    document.getElementById("secTitle").textContent=TITLES[cur];history.replaceState(null,"","#"+cur);
    render();
  }
});

setInterval(()=>{
  cdLeft--;
  if(cdLeft<=0){loadData();}
},1000);
if(TITLES[cur]){document.querySelectorAll(".nav-item").forEach(x=>x.classList.toggle("active",x.dataset.sec===cur));document.getElementById("secTitle").textContent=TITLES[cur];}else{cur="ribao";}loadData();
</script>
</body>
</html>
